    <script>
        // ==========================================
        // 1. COMPREHENSIVE KNOWLEDGE GRAPH
        // ==========================================
        const DB = {
            levels: [
                { id: 0, name: "VIEW", desc: "Can display the file visually, no editing capabilities.", class: "lvl-0" },
                { id: 1, name: "GEOMETRY", desc: "Transfers basic 2D/3D geometry. Semantics lost.", class: "lvl-1" },
                { id: 2, name: "STRUCTURE", desc: "Transfers assemblies, layers, or topology.", class: "lvl-2" },
                { id: 3, name: "SEMANTICS", desc: "Transfers meaningful objects, categories, properties.", class: "lvl-3" },
                { id: 4, name: "ASSOCIATIVITY", desc: "Maintains live updateable relationship.", class: "lvl-4" },
                { id: 5, name: "CONTINUITY", desc: "Maintains full lifecycle design information.", class: "lvl-5" }
            ],
            formats: [
                // BIM / OpenBIM
                { id: "ifc", ext: [".ifc", ".ifcxml", ".ifczip"], name: "Industry Foundation Classes", category: "BIM", type: "Open Standard", level: 3, cap: { geom: 3, bim: 3, param: 1, mat: 2, tex: 1, anim: 0, gis: 1, mfg: 0, meta: 3 }, desc: "The global open standard for Building Information Modeling (BIM) data exchange.", strengths: "Vendor-neutral semantic transfer, spatial hierarchy, object properties.", weaknesses: "Variable importer quality; parametric creation history is frozen.", native: [], neutral: ["Revit", "Archicad", "Tekla", "Vectorworks", "Civil 3D"] },
                { id: "rvt", ext: [".rvt", ".rfa", ".rte"], name: "Revit Ecosystem", category: "BIM", type: "Native", level: 5, cap: { geom: 3, bim: 3, param: 3, mat: 3, tex: 3, anim: 0, gis: 1, mfg: 1, meta: 3 }, desc: "Autodesk Revit native project, family, and template files.", strengths: "Maximum AEC application intelligence and MEPS coordination.", weaknesses: "Closed ecosystem; strict backwards compatibility constraints.", native: ["Revit"], neutral: ["Navisworks", "BIM 360"] },
                { id: "bcf", ext: [".bcf", ".bcfzip"], name: "BIM Collaboration Format", category: "BIM Coordination", type: "Open Standard", level: 3, cap: { geom: 0, bim: 3, param: 0, mat: 0, tex: 0, anim: 0, gis: 0, mfg: 0, meta: 3 }, desc: "XML/JSON format for transmitting issues, clashes, and viewpoints without the model geometry.", strengths: "Extremely lightweight issue tracking across different BIM platforms.", weaknesses: "Contains no geometry; must be used alongside IFC or native models.", native: ["BIMcollab", "Solibri"], neutral: ["Revit", "Archicad", "Navisworks"] },
                { id: "pln", ext: [".pln", ".pla"], name: "Archicad Project", category: "BIM", type: "Native", level: 5, cap: { geom: 3, bim: 3, param: 3, mat: 3, tex: 3, anim: 0, gis: 1, mfg: 0, meta: 3 }, desc: "Graphisoft Archicad native project file.", strengths: "Strong OpenBIM (IFC) support out of the box.", weaknesses: "Proprietary format.", native: ["Archicad"], neutral: [] },
                
                // CAD / Mechanical
                { id: "dwg", ext: [".dwg", ".dxf"], name: "AutoCAD Drawing", category: "CAD", type: "De Facto Standard", level: 2, cap: { geom: 3, bim: 1, param: 1, mat: 2, tex: 1, anim: 0, gis: 2, mfg: 1, meta: 2 }, desc: "Standard 2D/3D CAD drawing format.", strengths: "Ubiquitous for 2D line work and block references.", weaknesses: "Poor for semantic BIM exchange; 3D solids can fragment upon translation.", native: ["AutoCAD", "Civil 3D"], neutral: ["Most CAD apps"] },
                { id: "step", ext: [".stp", ".step"], name: "STEP (AP203/214/242)", category: "Mechanical CAD", type: "Open Standard", level: 3, cap: { geom: 3, bim: 0, param: 1, mat: 2, tex: 0, anim: 0, gis: 0, mfg: 3, meta: 2 }, desc: "ISO standard for product manufacturing information (PMI).", strengths: "Excellent for precise B-rep solid geometry exchange across platforms.", weaknesses: "Native parametric feature tree (sketches) is lost, resulting in 'dumb solids'.", native: [], neutral: ["SolidWorks", "Fusion 360", "Inventor", "CATIA", "Rhino"] },
                { id: "sldprt", ext: [".sldprt", ".sldasm"], name: "SolidWorks Part/Assembly", category: "Mechanical CAD", type: "Native", level: 5, cap: { geom: 3, bim: 0, param: 3, mat: 3, tex: 2, anim: 1, gis: 0, mfg: 3, meta: 3 }, desc: "Dassault Systèmes SolidWorks native files.", strengths: "Full parametric history, constraints, and manufacturing data.", weaknesses: "Difficult to import feature-trees into competitor MCAD software.", native: ["SolidWorks"], neutral: ["Mastercam"] },
                { id: "sat", ext: [".sat", ".sab"], name: "ACIS Solid", category: "Solid Kernel", type: "Neutral", level: 2, cap: { geom: 3, bim: 0, param: 0, mat: 0, tex: 0, anim: 0, gis: 0, mfg: 2, meta: 0 }, desc: "Standard format for the ACIS 3D modeling kernel.", strengths: "Highly reliable solid geometry transfer into Autodesk products (Revit/AutoCAD).", weaknesses: "No materials or BIM semantics.", native: [], neutral: ["Revit", "AutoCAD", "FormIt"] },
                
                // Visualization / Polygon / Real-time
                { id: "obj", ext: [".obj"], name: "Wavefront OBJ", category: "Polygon / Mesh", type: "Neutral", level: 1, cap: { geom: 2, bim: 0, param: 0, mat: 1, tex: 2, anim: 0, gis: 0, mfg: 1, meta: 0 }, desc: "Legacy, widely supported 3D geometry definition format.", strengths: "Universal compatibility for meshes and UV coordinates.", weaknesses: "No hierarchy, no animation, limited material definition. Zero BIM semantics.", native: [], neutral: ["All 3D software"] },
                { id: "fbx", ext: [".fbx"], name: "Filmbox", category: "Scene / VFX", type: "Proprietary Neutral", level: 2, cap: { geom: 2, bim: 0, param: 0, mat: 3, tex: 3, anim: 3, gis: 0, mfg: 0, meta: 1 }, desc: "Autodesk-owned format for 3D content creation exchange.", strengths: "Supports meshes, scene hierarchy, materials, cameras, lights, and skeletal animation.", weaknesses: "Proprietary SDK; version mismatch errors common.", native: ["MotionBuilder"], neutral: ["Maya", "3ds Max", "Unreal", "Unity", "Revit"] },
                { id: "gltf", ext: [".gltf", ".glb"], name: "glTF", category: "Real-time 3D", type: "Open Standard", level: 2, cap: { geom: 2, bim: 0, param: 0, mat: 3, tex: 3, anim: 2, gis: 0, mfg: 0, meta: 1 }, desc: "The 'JPEG of 3D'. Optimized for web and real-time engines.", strengths: "PBR materials natively, fast loading, single-file packaging.", weaknesses: "Not suitable for parametric CAD editing or BIM round-tripping.", native: [], neutral: ["Blender", "Three.js", "Unreal"] },
                { id: "usd", ext: [".usd", ".usda", ".usdz"], name: "Universal Scene Description", category: "Scene / VFX", type: "Open Standard", level: 3, cap: { geom: 3, bim: 0, param: 0, mat: 3, tex: 3, anim: 3, gis: 0, mfg: 0, meta: 2 }, desc: "Developed by Pixar, highly scalable framework for 3D scenes.", strengths: "Non-destructive layer composition, excellent for massive VFX scenes and Apple AR.", weaknesses: "Complex to implement; AEC metadata support is still evolving.", native: ["Maya", "Houdini"], neutral: ["Unreal", "Omniverse"] },
                
                // Fabrication / Point Cloud / GIS
                { id: "stl", ext: [".stl"], name: "Stereolithography", category: "Fabrication", type: "Neutral", level: 1, cap: { geom: 1, bim: 0, param: 0, mat: 0, tex: 0, anim: 0, gis: 0, mfg: 2, meta: 0 }, desc: "Standard format for 3D printing describing surface geometry as triangulated meshes.", strengths: "Supported by every 3D printing slicer.", weaknesses: "Units ambiguous; facets curves; zero metadata.", native: [], neutral: ["Slicers", "CAD"] },
                { id: "las", ext: [".las", ".laz"], name: "LASer Point Cloud", category: "Survey / Reality Capture", type: "Open Standard", level: 1, cap: { geom: 2, bim: 0, param: 0, mat: 0, tex: 1, anim: 0, gis: 3, mfg: 0, meta: 2 }, desc: "Standard for interchange of 3D point cloud data.", strengths: "Handles billions of points with classifications (ground, vegetation).", weaknesses: "Massive file sizes; requires meshing or tracing to convert to BIM solids.", native: [], neutral: ["Recap", "Civil 3D", "CloudCompare"] },
                { id: "shp", ext: [".shp", ".shx", ".dbf", ".prj"], name: "Shapefile", category: "GIS", type: "De Facto", level: 2, cap: { geom: 1, bim: 0, param: 0, mat: 0, tex: 0, anim: 0, gis: 3, mfg: 0, meta: 3 }, desc: "Esri geospatial vector data format.", strengths: "Universal GIS support for vector features and attributes.", weaknesses: "Multi-file structure; 2GB size limit; legacy architecture.", native: ["ArcGIS"], neutral: ["QGIS", "Civil 3D"] },
                { id: "citygml", ext: [".gml", ".cityjson"], name: "CityGML", category: "GeoBIM", type: "Open Standard", level: 3, cap: { geom: 2, bim: 2, param: 0, mat: 1, tex: 1, anim: 0, gis: 3, mfg: 0, meta: 3 }, desc: "OGC standard for representing 3D urban objects.", strengths: "Bridges GIS and BIM with distinct Levels of Detail (LOD 0-4).", weaknesses: "Heavy XML structure; CityJSON is often preferred for web.", native: [], neutral: ["FME", "ArcGIS"] },

                // 2D / Vector
                { id: "pdf", ext: [".pdf"], name: "Portable Document Format", category: "Documentation", type: "Open Standard", level: 0, cap: { geom: 1, bim: 0, param: 0, mat: 0, tex: 1, anim: 0, gis: 0, mfg: 0, meta: 1 }, desc: "Standard for fixed-layout document exchange.", strengths: "Universal viewing; preserves vector lines and text.", weaknesses: "A one-way street. Reverse-engineering CAD from PDF is lossy and inaccurate.", native: ["Acrobat"], neutral: ["All AEC software"] },
                { id: "svg", ext: [".svg"], name: "Scalable Vector Graphics", category: "Vector 2D", type: "Open Standard", level: 1, cap: { geom: 1, bim: 0, param: 0, mat: 0, tex: 0, anim: 0, gis: 0, mfg: 1, meta: 0 }, desc: "XML-based vector image format.", strengths: "Web standard; excellent for laser cutting profiles and UI icons.", weaknesses: "Not a CAD format; lacks scale/units intelligence.", native: ["Illustrator"], neutral: ["Web", "Laser Cutters"] }
            ],
            software: [
                { name: "Autodesk Revit", type: "BIM", native: ["RVT", "RFA"], import: ["DWG", "SAT", "IFC", "SKP", "OBJ", "CAD"], export: ["IFC", "DWG", "NWC", "FBX", "SAT"] },
                { name: "Graphisoft Archicad", type: "BIM", native: ["PLN", "GSM"], import: ["IFC", "DWG", "SKP", "RFA", "PDF"], export: ["IFC", "DWG", "BIMx", "FBX"] },
                { name: "Dassault SolidWorks", type: "MCAD", native: ["SLDPRT", "SLDASM"], import: ["STEP", "IGES", "Parasolid", "DWG"], export: ["STEP", "STL", "3MF", "IGES", "PDF"] },
                { name: "Autodesk Civil 3D", type: "Civil / GIS", native: ["DWG"], import: ["SHP", "LandXML", "LAS", "IFC"], export: ["LandXML", "DWG", "IFC", "PDF"] },
                { name: "McNeel Rhino 3D", type: "NURBS / Parametric", native: ["3DM", "GH"], import: ["STEP", "DWG", "OBJ", "IGES"], export: ["STEP", "OBJ", "FBX", "DWG", "STL"] },
                { name: "Blender", type: "DCC / Polygon", native: ["BLEND"], import: ["OBJ", "FBX", "GLTF", "STL"], export: ["GLTF", "FBX", "OBJ", "STL"] },
                { name: "Epic Unreal Engine", type: "Real-time", native: ["UMAP", "UASSET"], import: ["FBX", "GLTF", "USD", "Datasmith"], export: ["FBX", "GLTF"] },
                { name: "QGIS", type: "GIS", native: ["QGZ"], import: ["SHP", "GeoJSON", "GeoTIFF", "DXF"], export: ["SHP", "GeoJSON", "KML", "PDF"] }
            ],
            glossary: [
                { term: "B-rep (Boundary Representation)", def: "A method of representing 3D shapes in CAD by defining their limits (faces, edges, vertices). Retains exact mathematical curvature.", related: ["STEP", "SolidWorks", "Inventor"] },
                { term: "Topology", def: "The way geometric parts connect. In MEP, it determines how a duct connects to a VAV box. Visual meshes do not contain topology.", related: ["IFC", "RVT", "MEP"] },
                { term: "Parametric History", def: "The sequential list of operations (sketches, extrusions, constraints) used to create a model. Destroyed when exporting to neutral formats.", related: ["Native CAD", "STEP (Loss)"] },
                { term: "Metadata", def: "Data about data. In BIM, this is non-graphical information like fire rating, manufacturer, serial number, or COBie data.", related: ["IFC", "BIM"] },
                { term: "Georeferencing", def: "Aligning geographic data to a known coordinate system so it can be viewed, queried, and analyzed with other geographic data.", related: ["GIS", "Civil 3D", "SHP"] },
                { term: "Non-Manifold Geometry", def: "3D geometry that cannot exist in the real world (e.g., edges shared by more than two faces, zero-thickness walls). Causes 3D prints to fail.", related: ["STL", "3D Printing"] },
                { term: "MVD (Model View Definition)", def: "A subset of the IFC schema designed to satisfy specific exchange requirements (e.g., 'Coordination View' vs 'Structural Analysis View').", related: ["IFC", "OpenBIM"] },
                { term: "Round-Tripping", def: "Exporting data from Application A, importing to B, editing, and exporting back to A. Highly susceptible to data degradation.", related: ["Data Loss", "Workflow"] }
            ],
            caseStudies: [
                { title: "Architectural BIM to Structural Analysis", path: "Revit → IFC (Structural MVD) → Robot / Tekla", desc: "Use IFC to transfer load-bearing elements. Do not send DWG, as structural software needs object semantics (beams, columns, analytical lines) to run physics calculations." },
                { title: "MCAD to BIM (Manufacturing to AEC)", path: "SolidWorks → SAT / STEP / Shrinkwrap → Revit Family (RFA)", desc: "Do not import massive MCAD assemblies directly into BIM. Simplify the STEP file, strip internal mechanical components, and import geometry to wrap with BIM parameters and MEP connectors." },
                { title: "BIM to Real-Time Visualization", path: "Archicad / Revit → Datasmith / FBX / glTF → Unreal / Twinmotion", desc: "Focus shifts from BIM semantics to Material/UV/Polygon data. Extracting via Datasmith or glTF ensures PBR materials and scene hierarchies remain intact." },
                { title: "Civil Topography to Architectural BIM", path: "Civil 3D → LandXML / DWG (Shared Coordinates) → Revit", desc: "Ensure the coordinate systems (Project Base Point / Survey Point) are established first. LandXML transfers intelligent TIN surfaces better than generic 3D DWG faces." }
            ]
        };

        // ==========================================
        // 2. CORE SYSTEM FUNCTIONS
        // ==========================================
        function nav(viewId) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeBtn = document.querySelector(`.nav-item[data-view="${viewId}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            
            const main = document.getElementById('mainContent');
            const rightPanel = document.getElementById('rightPanel');
            rightPanel.classList.add('hidden'); // Close context panel

            switch(viewId) {
                case 'dashboard': renderDashboard(main); break;
                case 'formats': renderFormats(main); break;
                case 'matrix': renderMatrix(main); break;
                case 'software': renderSoftware(main); break;
                case 'lossEngine': renderLossEngine(main); break;
                case 'wizard': renderWizard(main); break;
                case 'dragdrop': renderDragDrop(main); break;
                case 'health': renderHealthCheck(main); break;
                case 'caseStudies': renderCaseStudies(main); break;
                case 'glossary': renderGlossary(main); break;
                case 'education': renderEducation(main); break;
            }
            lucide.createIcons();
        }

        function capScoreToLabel(score) {
            const labels = [
                '<span class="score-0 font-bold">LOST (0)</span>',
                '<span class="score-1">PARTIAL (1)</span>',
                '<span class="score-2">GOOD (2)</span>',
                '<span class="score-3">FULL (3)</span>'
            ];

        function calculateLoss() {
            const srcId = document.getElementById('lossSrc').value;
            const dstId = document.getElementById('lossDst').value;
            const src = DB.formats.find(f => f.id === srcId);
            const dst = DB.formats.find(f => f.id === dstId);
            const resContainer = document.getElementById('lossResults');

            // Algorithm: Data cannot exceed destination limits, and cannot be created if source lacks it.
            const evaluate = (s, d) => Math.min(s, d);

            const results = {
                geom: evaluate(src.cap.geom, dst.cap.geom),
                bim: evaluate(src.cap.bim, dst.cap.bim),
                param: evaluate(src.cap.param, dst.cap.param),
                mat: evaluate(src.cap.mat, dst.cap.mat),
                meta: evaluate(src.cap.meta, dst.cap.meta)
            };

            let warning = "";
            if (src.cap.bim > 1 && results.bim === 0) {
                warning = `<div class="bg-red-900/20 border border-red-500/50 text-red-200 p-4 rounded-lg flex gap-4 mb-6 shadow-lg">
                    <i data-lucide="alert-triangle" class="w-6 h-6 shrink-0 text-red-500 mt-1"></i>

                        <p class="text-sm leading-relaxed">Converting a BIM/Semantic model to a polygon format (${dst.ext[0]}). All object intelligence, MEP connectivity, layer structures, and engineering properties will be permanently destroyed. Geometry will become 'dumb' faces.</p>
                    </div>
                </div>`;
            } else if (src.cap.param > 1 && results.param === 0) {
                warning = `<div class="bg-orange-900/20 border border-orange-500/50 text-orange-200 p-4 rounded-lg flex gap-4 mb-6">
                    <i data-lucide="info" class="w-6 h-6 shrink-0 text-orange-500 mt-1"></i>
                    <div>
                        <strong class="block font-mono tracking-wide text-orange-400 uppercase text-sm mb-1">Parametric History Loss</strong>
                        <p class="text-sm">Native feature trees (sketches, extrusions) will not transfer. Result will be uneditable Boundary Representation (B-rep) solids or meshes.</p>
                    </div>
                </div>`;
            }

            resContainer.innerHTML = `
                ${warning}
                <div class="bg-tech-900 border border-tech-700 rounded-lg overflow-hidden shadow-2xl">
                    <div class="bg-tech-800 px-6 py-4 border-b border-tech-700 font-mono text-sm text-slate-300 flex justify-between">
                        <span>Analysis: <span class="text-white">${src.ext[0].toUpperCase()} → ${dst.ext[0].toUpperCase()}</span></span>
                        <span class="text-tech-cyan">STATUS COMPLETED</span>
                    </div>
                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-4">
                        <div class="flex justify-between items-center border-b border-tech-800/50 pb-3">
                            <span class="text-slate-400 font-mono text-sm">Geometry / Solids</span>

                        </div>
                        <div class="flex justify-between items-center border-b border-tech-800/50 pb-3">
                            <span class="text-slate-400 font-mono text-sm">BIM Semantics</span>
                            <span class="font-mono text-sm">${capScoreToLabel(results.bim)}</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-tech-800/50 pb-3">
                            <span class="text-slate-400 font-mono text-sm">Parametric History</span>
                            <span class="font-mono text-sm">${capScoreToLabel(results.param)}</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-tech-800/50 pb-3">
                            <span class="text-slate-400 font-mono text-sm">Materials / UVs</span>
                            <span class="font-mono text-sm">${capScoreToLabel(results.mat)}</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-tech-800/50 pb-3">
                            <span class="text-slate-400 font-mono text-sm">Embedded Metadata</span>
                            <span class="font-mono text-sm">${capScoreToLabel(results.meta)}</span>
                        </div>
                    </div>
                </div>
            `;
            resContainer.classList.remove('hidden');
            lucide.createIcons();
        }

                        <div class="p-4 bg-tech-blue/20 border border-tech-cyan rounded text-lg text-tech-cyan font-bold shadow-[0_0_15px_rgba(0,240,255,0.2)]">${bridge}</div>
                        <i data-lucide="arrow-right" class="w-6 h-6 text-tech-cyan"></i>
                        <div class="p-4 bg-tech-900 border border-tech-700 rounded text-sm text-slate-300">${dst}</div>
                    </div>
                    <p class="text-sm text-slate-400 mt-6 z-10 relative"><strong>Why:</strong> ${logic}</p>
                </div>
            `;
            res.classList.remove('hidden');
            lucide.createIcons();
        }

        function renderHealthCheck(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto animate-fade-in">
                    <h2 class="text-3xl font-mono text-white mb-2 uppercase">Design Data Health Check</h2>
                    <p class="text-slate-400 mb-8 text-sm">Always validate the model post-translation before assuming success. "File opened" != "Data preserved".</p>

                    <div class="bg-tech-900 border border-tech-700 rounded-lg p-6 space-y-2 shadow-xl">
                        ${[
                            {t: "Units Verification", d: "Measure a known object (e.g., a standard door). Are 1000mm interpreting as 1000 inches? Scaling issues are the #1 translation error."},
                            {t: "Coordinate System / Origin", d: "Does the imported model land at the correct Project Base Point/Survey Point? Very large coordinates can cause floating-point precision jitter in 3D apps."},
                            {t: "Normal Orientation", d: "Check for reversed/flipped normals. Do faces turn black or invisible in rendering views?"},
                            {t: "BIM Classifications", d: "Select an object. Does the wall still identify as 'IfcWall' with its fire rating, or is it now a generic 'Mesh Object'?"},
                            {t: "Tessellation & Faceting", d: "Look at curved surfaces (pipes, columns). Are they smooth B-reps, or have they been faceted into rigid polygons?"}
                        ].map(item => `
                            <label class="flex items-start gap-4 p-4 hover:bg-tech-800 rounded transition-colors cursor-pointer border border-transparent hover:border-tech-700">
                                <input type="checkbox" class="mt-1 w-5 h-5 rounded border-tech-700 bg-tech-900 text-tech-cyan focus:ring-tech-cyan focus:ring-offset-tech-900">
                                <div>
                                    <strong class="block text-white font-mono text-sm uppercase">${item.t}</strong>
                                    <span class="text-sm text-slate-400 mt-1 block">${item.d}</span>
                                </div>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCaseStudies(container) {
            let html = `
                <div class="max-w-5xl mx-auto animate-fade-in">
                    <h2 class="text-3xl font-mono text-white mb-6 uppercase">Project Scenario Library</h2>
                    <div class="grid md:grid-cols-2 gap-6">
            `;
            DB.caseStudies.forEach(c => {
                html += `
                    <div class="bg-tech-800/40 border-l-4 border-tech-cyan p-6 rounded-r shadow-lg">
                        <h4 class="font-mono text-white text-lg mb-2">${c.title}</h4>
                        <div class="bg-tech-900 text-tech-cyan font-mono text-xs px-3 py-2 rounded mb-4 inline-block border border-tech-700">${c.path}</div>
                        <p class="text-sm text-slate-300 leading-relaxed">${c.desc}</p>
                    </div>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderGlossary(container) {
            let html = `
                <div class="max-w-4xl mx-auto animate-fade-in">
                    <h2 class="text-3xl font-mono text-white mb-6 uppercase">Technical Glossary</h2>
                    <div class="grid gap-4">
            `;
            DB.glossary.forEach(g => {
                html += `
                    <div class="bg-tech-800/30 border border-tech-700 p-5 rounded hover:border-tech-blue transition-colors">
                        <h4 class="font-mono text-lg text-white mb-2">${g.term}</h4>
                        <p class="text-sm text-slate-300 mb-4">${g.def}</p>
                        <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">
                            Related: <span class="text-tech-cyan">${g.related.join(', ')}</span>
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderEducation(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto animate-fade-in">
                    <h2 class="text-3xl font-mono text-white mb-6 uppercase">Educational Mode</h2>
                    <div class="space-y-6">
                        <div class="bg-tech-800/40 border border-tech-700 rounded-lg p-6">
                            <h3 class="text-lg font-mono text-tech-green mb-2 uppercase">Beginner: What is a format?</h3>
                            <p class="text-sm text-slate-300">A file format is a standardized way of encoding information. Think of it like a language. If software speaks English natively, translating to French (exporting) might lose cultural nuances (data degradation). Native formats hold the most intelligence.</p>
                        </div>
                        <div class="bg-tech-800/40 border border-tech-700 rounded-lg p-6">
                            <h3 class="text-lg font-mono text-tech-blue mb-2 uppercase">Intermediate: Why does geometry disappear?</h3>
                            <p class="text-sm text-slate-300">Translating between math models causes issues. Converting a perfectly curved solid (B-rep) into a polygon mesh (OBJ) shatters the smooth curve into thousands of tiny flat triangles. You cannot easily un-shatter the mesh back into a solid. It is a one-way street.</p>
                        </div>
                        <div class="bg-tech-800/40 border border-tech-700 rounded-lg p-6">
                            <h3 class="text-lg font-mono text-tech-orange mb-2 uppercase">Advanced: OpenBIM vs Native</h3>
                            <p class="text-sm text-slate-300">Why can two BIM apps produce different IFC results? IFC is a schema (a dictionary). How well an application writes or reads that dictionary depends on the software vendor's translator logic. A poorly coded exporter will result in broken IFCs, even if the schema itself is perfect.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 4. COMPONENTS & INTERACTIONS
        // ==========================================

        function showFormatCard(id) {
            const format = DB.formats.find(f => f.id === id);
            const panel = document.getElementById('rightPanel');
            
            panel.innerHTML = `
                <div class="flex justify-between items-center mb-6 border-b border-tech-700 pb-4">
                    <h3 class="font-mono text-2xl text-white font-bold">${format.ext[0].toUpperCase()}</h3>
                    <button onclick="document.getElementById('rightPanel').classList.add('hidden')" class="text-slate-400 hover:text-white p-1 rounded hover:bg-tech-700">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <div class="text-[10px] font-mono text-slate-500 mb-1 uppercase tracking-widest">Format Name</div>
                        <div class="text-sm text-white font-medium">${format.name}</div>
                    </div>
                    
                    <div>
                        <div class="text-[10px] font-mono text-slate-500 mb-2 uppercase tracking-widest">Extensions</div>
                        <div class="flex gap-2 flex-wrap">
                            ${format.ext.map(e => `<span class="bg-tech-800 border border-tech-700 px-2 py-1 rounded text-xs font-mono text-tech-cyan">${e}</span>`).join('')}
                        </div>
                    </div>

                    <div>
                        <div class="text-[10px] font-mono text-slate-500 mb-1 uppercase tracking-widest">Description</div>
                        <div class="text-sm text-slate-300 leading-relaxed">${format.desc}</div>
                    </div>

                    <div class="bg-tech-800/50 p-4 rounded border border-tech-700/50">
                        <div class="text-[10px] font-mono text-tech-green mb-2 tracking-widest uppercase"><i data-lucide="check-circle" class="w-3 h-3 inline mr-1"></i> Strengths</div>
                        <div class="text-sm text-slate-300">${format.strengths}</div>
                    </div>

                    <div class="bg-tech-800/50 p-4 rounded border border-tech-700/50">
                        <div class="text-[10px] font-mono text-tech-red mb-2 tracking-widest uppercase"><i data-lucide="alert-circle" class="w-3 h-3 inline mr-1"></i> Weaknesses</div>
                        <div class="text-sm text-slate-300">${format.weaknesses}</div>
                    </div>

                    <div>
                        <div class="text-[10px] font-mono text-slate-500 mb-2 uppercase tracking-widest">Software Ecosystems</div>
                        <div class="text-xs text-slate-400 mb-2 p-2 bg-tech-900 rounded border border-tech-700"><strong class="text-slate-300 block mb-1">Native To:</strong> ${format.native.length ? format.native.join(', ') : 'None / Neutral Standard'}</div>
                        <div class="text-xs text-slate-400 p-2 bg-tech-900 rounded border border-tech-700"><strong class="text-slate-300 block mb-1">Neutral / Supported By:</strong> ${format.neutral.join(', ')}</div>
                    </div>
                </div>
            `;
            
            lucide.createIcons();
            panel.classList.remove('hidden');
        }

        // ==========================================
        // 5. INITIALIZATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            nav('dashboard');
            
            const searchInput = document.getElementById('globalSearch');
            const searchResults = document.getElementById('searchResults');
            
            searchInput.addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                if(q.length < 2) {
                    searchResults.classList.add('hidden');
                    return;
                }
                
                // Search Formats
                const formatHits = DB.formats.filter(f => 
                    f.name.toLowerCase().includes(q) || 
                    f.ext.some(ext => ext.toLowerCase().includes(q)) ||
                    f.category.toLowerCase().includes(q)
                );

                // Search Software
                const swHits = DB.software.filter(sw => 
                    sw.name.toLowerCase().includes(q) || sw.type.toLowerCase().includes(q)
                );

                let resultsHTML = '';

                if (formatHits.length > 0) {
                    resultsHTML += `<div class="px-3 py-1 bg-tech-800 text-[10px] font-mono text-slate-400 uppercase tracking-widest">Formats</div>`;
                    resultsHTML += formatHits.map(f => `
                        <div onclick="nav('formats'); showFormatCard('${f.id}'); document.getElementById('searchResults').classList.add('hidden');" class="p-3 border-b border-tech-700 hover:bg-tech-800 cursor-pointer flex justify-between items-center transition-colors">
                            <div>
                                <span class="font-bold text-tech-cyan font-mono text-sm">${f.ext[0]}</span>
                                <span class="text-sm text-slate-300 ml-2">${f.name}</span>
                            </div>
                            <span class="text-xs text-slate-500 font-mono">${f.category}</span>
                        </div>
                    `).join('');
                }

                if (swHits.length > 0) {
                    resultsHTML += `<div class="px-3 py-1 bg-tech-800 text-[10px] font-mono text-slate-400 uppercase tracking-widest">Software</div>`;
                    resultsHTML += swHits.map(sw => `
                        <div onclick="nav('software'); document.getElementById('searchResults').classList.add('hidden');" class="p-3 border-b border-tech-700 hover:bg-tech-800 cursor-pointer flex justify-between items-center transition-colors">
                            <div class="text-sm text-slate-300">${sw.name}</div>
                            <span class="text-xs text-tech-blue font-mono border border-tech-blue px-2 py-0.5 rounded">${sw.type}</span>
                        </div>
                    `).join('');
                }

                if(resultsHTML === '') {
                    searchResults.innerHTML = `<div class="p-4 text-sm text-slate-500 font-mono text-center">No structural matches found for '${q}'.</div>`;
                } else {
                    searchResults.innerHTML = resultsHTML;
                }
                searchResults.classList.remove('hidden');
            });

            document.addEventListener('click', (e) => {
                if(!e.target.closest('#globalSearch') && !e.target.closest('#searchResults')) {
                    searchResults.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
